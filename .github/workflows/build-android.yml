name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install dependencies
        run: npm ci

      - name: Run automated unit tests
        run: npm test

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Expo Prebuild (Generate Android native project)
        run: npx expo prebuild --platform android --clean --no-install

      - name: Configure Android Proguard Rules for SQLite, Audio and AsyncStorage
        run: |
          echo "-keep class com.reactnativecommunity.asyncstorage.** { *; }" >> android/app/proguard-rules.pro
          echo "-keep class expo.modules.sqlite.** { *; }" >> android/app/proguard-rules.pro
          echo "-keep class expo.modules.audio.** { *; }" >> android/app/proguard-rules.pro
          echo "-keep class expo.modules.haptics.** { *; }" >> android/app/proguard-rules.pro
          echo "-keep class expo.modules.speechrecognition.** { *; }" >> android/app/proguard-rules.pro

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android Release APK & Google Play AAB Bundle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Prepare APK and AAB Deliverables
        run: |
          mkdir -p dist-apk
          APK_PATH=$(find android/app/build/outputs/apk -name "*release*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          if [ -f "$APK_PATH" ]; then
            echo "Found Standalone Release APK at: $APK_PATH"
            cp "$APK_PATH" dist-apk/ORRALI-5.0.0.apk
          else
            echo "Error: No APK file found!"
            find android/app/build/outputs/ -type f || true
            exit 1
          fi

          AAB_PATH=$(find android/app/build/outputs/bundle -name "*release*.aab" | head -n 1)
          if [ -z "$AAB_PATH" ]; then
            AAB_PATH=$(find android/app/build/outputs/bundle -name "*.aab" | head -n 1)
          fi
          if [ -f "$AAB_PATH" ]; then
            echo "Found Google Play Bundle at: $AAB_PATH"
            cp "$AAB_PATH" dist-apk/ORRALI-5.0.0.aab
          fi
          ls -la dist-apk/

      - name: Upload APK & AAB as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ORRALI-5.0.0-Android-Deliverables
          path: dist-apk/*
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.0.0
          name: ORRALI v5.0.0 — The Ultimate Store Edition (Complete European Triad, Scramble Drills & Google Play Bundle)
          body_path: RELEASE_NOTES.md
          files: |
            dist-apk/ORRALI-5.0.0.apk
            dist-apk/ORRALI-5.0.0.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
